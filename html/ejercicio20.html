
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 20 - Datos de Alumno</title>
    <link rel="stylesheet" href="../css/ejercicio20.css">
</head>
<body>
    <div class="contenedor">
        <h2>Ingreso de Datos</h2>
        <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Ingrese su nombre">
        </div>
        <div class="campo">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" placeholder="Ingrese su apellido">
        </div>
        <div class="campo">
            <label for="lu">Libreta Universitaria:</label>
            <input type="text" id="lu" placeholder="Ej: APU999999">
        </div>
        <button id="btnMostrar">Mostrar Datos</button>
    </div>

    <script type="module" src="../js/ejercicio20.js"></script>
</body>
</html>
